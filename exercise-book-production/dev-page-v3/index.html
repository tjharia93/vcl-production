<style>
/* Exercise Book Production v3 · VCL Compass look (05/11/2026): flat white cards on hairline borders, one blue,
   dark header, amber = needs action, red = errors only. Touch targets stay >= 44px for the floor tablets. */
@font-face{font-family:"InterVariable";font-style:normal;font-weight:100 900;font-display:swap;src:url(/assets/frappe/css/fonts/inter/InterVariable.woff2) format("woff2")}
.ebv3{--brand:#2B3990;--brand-dark:#243079;--brand-mid:#3d52c4;--brand-light:#EEF1FB;--brand-lt:#B9C0E6;--on-brand:#fff;--link:#2B3990;
  --bg:#F5F6F8;--card:#fff;--border:#E4E7EC;--border-input:#D0D5DD;--border-strong:#98A2B3;--th:#F9FAFB;--hover:#F4F6F8;
  --text:#344054;--heading:#101828;--weak:#667085;--weaker:#98A2B3;--neutral-bg:#F2F4F7;
  --ok:#0B6B3A;--ok-bg:#E8F5EE;--bad:#7D2B31;--bad-bg:#FBEDEE;--warn:#9A4D00;--warn-bg:#FFF4E5;--info:#2B3990;--info-bg:#EEF1FB;
  --sans:"InterVariable","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:var(--sans);
  --sh:none;--sh-modal:0 16px 40px rgba(16,24,40,.18);--sh-over:0 4px 12px rgba(16,24,40,.08);
  --hdr-bg:#1a2460;--hdr-ink:#fff;--hdr-ink2:rgba(255,255,255,.74);--hdr-line:rgba(255,255,255,.14);
  background:var(--bg);color:var(--text);font:14px/20px var(--sans);font-variant-numeric:tabular-nums;margin:0 calc(50% - 50vw);padding:0 0 48px;min-height:100vh;-webkit-font-smoothing:antialiased}
.ebv3 *{box-sizing:border-box}
.ebv3 .wrap{max-width:1240px;margin:0 auto;padding:0 16px}
/* page header (slds-page-header) */
.ebv3 header.bar{padding:12px 0 0}
.ebv3 header.bar .wrap{display:block}
.ebv3 .ph{background:var(--card);border:1px solid var(--border-input);border-radius:6px;box-shadow:none;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ebv3 .ph-ico{width:40px;height:40px;border-radius:6px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:600;font-size:15px;letter-spacing:.5px;flex:none}
.ebv3 .ph-t{min-width:0;flex:1 1 260px}
.ebv3 .ph-k{margin:0;font-size:12px;line-height:16px;color:var(--weak)}
.ebv3 header.bar h1{margin:0;font-size:20px;line-height:26px;font-weight:600;color:var(--text)}
.ebv3 .ph-sub{margin:0;font-size:13px;color:var(--weak)}
/* view tabs (slds-tabs_default) and button groups */
.ebv3 .mode{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0 12px}
.ebv3 .seg{display:inline-flex;flex:none}
.ebv3 .seg button{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border:1px solid var(--border-input);margin-left:-1px;background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ebv3 .seg button:first-child{border-radius:6px 0 0 4px;margin-left:0}.ebv3 .seg button:last-child{border-radius:0 4px 4px 0}
.ebv3 .seg button:hover{background:var(--hover)}
.ebv3 .seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand);position:relative;z-index:1}
.ebv3 .seg.views{display:flex;width:100%;border-bottom:1px solid var(--border-input);gap:4px}
.ebv3 .seg.views button{border:0;border-radius:0;margin:0;background:transparent;color:var(--weak);font-size:15px;min-height:46px;padding:0 14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.ebv3 .seg.views button:hover{color:var(--text);border-bottom-color:var(--border-input);background:transparent}
.ebv3 .seg.views button[aria-pressed="true"]{background:transparent;color:var(--text);border-bottom-color:var(--brand)}
/* scoped notifications */
.ebv3 .banner{padding:10px 14px;border-radius:6px;font-weight:600;margin:0 0 12px;border:1px solid transparent}
.ebv3 .banner.preview{background:var(--info-bg);color:var(--info);border-color:#b8d0f5;border-left-color:var(--info)}
.ebv3 .banner.live{background:var(--warn-bg);color:var(--warn);border-color:#f5d78a;border-left-color:#dd7a01}
/* layout + cards (slds-card) */
.ebv3 .cap{display:grid;gap:12px}
.ebv3 .cap-top{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:end;background:var(--card);border:1px solid var(--border-input);border-radius:6px;box-shadow:none;padding:12px 14px}
.ebv3 .cap-top + .cap-top{margin-top:-13px;border-top:0;border-radius:0 0 4px 4px;align-items:center}
.ebv3 .cap-top:has(+ .cap-top){border-radius:6px 4px 0 0}
.ebv3 .cap-grp{display:grid;gap:4px;min-width:0;flex:1 1 240px}
.ebv3 .cap-grp.of{flex:1 1 140px}
.ebv3 .cap-card{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:none;padding:0 16px 16px;display:grid;gap:16px;min-width:0;align-content:start}
.ebv3 .cap-card > .cap-h{margin:0 -16px;padding:16px;border-bottom:1px solid var(--border)}
.ebv3 .cap-card > .tw{margin:0 -16px}
.ebv3 .cap-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.ebv3 .cap-h h3{margin:0;font-size:16px;line-height:22px;font-weight:600;color:var(--text)}
.ebv3 .cap-note{font-size:13px;color:var(--weak)}
.ebv3 .btn-grp{display:inline-flex;flex-wrap:wrap;gap:8px}
/* form elements: label above */
.ebv3 .lb{font-size:12px;line-height:16px;color:var(--weak)}
.ebv3 select,.ebv3 input{font:16px var(--sans);min-height:44px;padding:0 12px;border:1px solid var(--border-input);border-radius:6px;background-color:var(--card);color:var(--text);width:100%;outline:0}
.ebv3 select{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 14 14%22%3E%3Cpath d=%22M2 5l5 5 5-5z%22 fill=%22%23747474%22/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.ebv3 select:focus,.ebv3 input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-light)}
.ebv3 select:disabled{background-color:var(--bg);color:var(--weaker)}
.ebv3 input.qty{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;min-height:54px}
/* stations as the Lightning path (slds-path) */
.ebv3 .cap-steps{display:flex;gap:0;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:none;padding:8px}
.ebv3 .cap-steps .arr{display:none}
.ebv3 .cap-steps button{flex:1 1 0;display:grid;align-content:center;justify-items:center;gap:4px;text-align:center;font:inherit;padding:8px 16px 8px 24px;min-height:56px;border:0;background:var(--neutral-bg);color:var(--text);cursor:pointer;min-width:0;margin-left:-6px;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.ebv3 .cap-steps button:first-of-type{margin-left:0;border-radius:8px 0 0 8px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.ebv3 .cap-steps button:last-of-type{border-radius:0 8px 8px 0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12px 50%)}
.ebv3 .cap-steps button:hover{background:var(--border)}
.ebv3 .cap-steps button .k{font-size:11px;line-height:16px;letter-spacing:.3px;text-transform:uppercase;color:var(--weak)}
.ebv3 .cap-steps button .t{font-weight:600;font-size:14px;line-height:20px}
.ebv3 .cap-steps button.fg{background:var(--ok-bg)}
.ebv3 .cap-steps button[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
.ebv3 .cap-steps button[aria-selected="true"] .k{color:var(--on-brand);opacity:.85}
@media (max-width:700px){
  .ebv3 .cap-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .ebv3 .cap-steps button,.ebv3 .cap-steps button:first-of-type,.ebv3 .cap-steps button:last-of-type{grid-column:span 2;margin:0;min-height:44px;border-radius:8px;clip-path:none;padding:8px}
  .ebv3 .cap-steps button[data-s="packing"],.ebv3 .cap-steps button[data-s="fg"]{grid-column:span 3}
}
.ebv3 .cap-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.ebv3 .cap-grid{grid-template-columns:1fr}}
.ebv3 .cap-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.ebv3 .cap-f{display:grid;gap:4px;min-width:0;align-content:start}
.ebv3 .cap-ro{min-height:44px;display:flex;align-items:center;font-weight:600;font-size:15px;color:var(--text);overflow-wrap:anywhere;border-bottom:1px solid var(--border)}
.ebv3 .cap-ro.mono{font-family:var(--mono);font-size:13px}
.ebv3 .cap-check{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.ebv3 .cap-check input{width:20px;min-height:20px;height:20px;accent-color:var(--brand);flex:none}
/* buttons: brand + neutral */
.ebv3 .cap-post{font:inherit;font-weight:600;font-size:16px;min-height:48px;border:1px solid var(--brand);border-radius:6px;background:var(--brand);color:var(--on-brand);cursor:pointer;width:100%}
.ebv3 .cap-post:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.ebv3 .cap-post:disabled{background:var(--neutral-bg);border-color:var(--neutral-bg);color:var(--weaker);cursor:not-allowed}
.ebv3 .cap-sec{font:inherit;font-weight:600;font-size:14px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--border-input);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap}
.ebv3 .cap-sec:hover{background:var(--hover)}
.ebv3 .cap-sec.sm{min-height:32px;padding:0 12px;font-size:13px}
.ebv3 .cap-sec:disabled{color:var(--weaker);cursor:not-allowed}
/* entry rows */
.ebv3 .cap-rows{display:grid;gap:0;border:1px solid var(--border);border-radius:6px}
.ebv3 .cap-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--border)}
.ebv3 .cap-row:first-child{border-top:0}
.ebv3 .cap-row .d{font-family:var(--mono);font-weight:600;font-size:12px;text-align:center;padding:2px 0;border-radius:15rem}
.ebv3 .cap-row.out .d{background:var(--neutral-bg);color:var(--text)}
.ebv3 .cap-row.in .d{background:var(--ok-bg);color:var(--ok)}
.ebv3 .cap-row .it{min-width:0;display:grid;gap:1px}.ebv3 .cap-row .it b{font-weight:600;color:var(--heading)}.ebv3 .cap-row .it code{display:block;overflow-wrap:anywhere;font-family:var(--mono);font-size:13px}
.ebv3 .cap-row .it span{display:block;font-size:12px;color:var(--weak)}
.ebv3 .cap-row .q{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ebv3 .cap-row .q b{font-size:16px}.ebv3 .cap-row .q small{display:block;color:var(--weak);font-size:12px}
@media (max-width:600px){
  .ebv3 .cap-row{grid-template-columns:48px minmax(0,1fr);gap:8px 12px;padding:16px 12px;align-items:start}
  .ebv3 .cap-row .d{margin-top:2px}
  .ebv3 .cap-row .it{gap:4px}
  .ebv3 .cap-row .it span{line-height:18px}
  .ebv3 .cap-row .q{grid-column:2;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;text-align:left;white-space:normal}
  .ebv3 .cap-row .q small{line-height:18px}
}
/* scoped notifications */
.ebv3 .cap-msg{padding:10px 12px;border-radius:6px;font-size:14px;border:1px solid transparent}
.ebv3 .cap-msg.bad{background:var(--bad-bg);color:var(--bad);font-weight:600;border-color:#f9c1b8;border-left-color:var(--bad)}
.ebv3 .cap-msg.warn{background:var(--warn-bg);color:var(--warn);font-weight:600;border-color:#f5d78a;border-left-color:#dd7a01}
.ebv3 .cap-msg.ok{background:var(--ok-bg);color:var(--ok);font-weight:600;border-color:#b9e2a8;border-left-color:var(--ok)}
.ebv3 .cap-msg.info{background:var(--info-bg);color:var(--info);border-color:#b8d0f5;border-left-color:var(--info)}
/* metric tiles */
.ebv3 .cap-stock{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}
.ebv3 .cap-stock div{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--card);display:grid;grid-template-rows:auto auto 1fr;gap:8px;align-content:start;min-width:0;box-shadow:none}
.ebv3 .cap-card .cap-stock div{box-shadow:none;border-color:var(--border)}
.ebv3 .cap-stock .n{font-size:12px;line-height:16px;font-weight:500;color:var(--weak)}
.ebv3 .cap-stock .v{font-family:var(--mono);font-size:28px;line-height:36px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--heading)}
.ebv3 .cap-stock .v small{font-family:var(--sans);font-size:12px;line-height:16px;font-weight:500;letter-spacing:0;color:var(--weak)}
.ebv3 .cap-stock .s{font-size:12px;line-height:18px;color:var(--weak)}
@media (max-width:600px){
  .ebv3 .cap-stock{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ebv3 .cap-stock div{padding:12px;gap:4px}
  .ebv3 .cap-stock .v{font-size:clamp(20px,6vw,24px);line-height:32px}
  .ebv3 .cap-stock .v small{display:block}
  .ebv3[data-view="orders"] .cap>.cap-stock>div:last-child{grid-column:1/-1}
}
/* data tables (slds-table_bordered) */
.ebv3 table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card)}
.ebv3 th,.ebv3 td{text-align:left;padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
.ebv3 thead th{font-size:13px;font-weight:600;color:var(--weak);background:var(--th);border-top:0;border-bottom:1px solid var(--border-input);white-space:nowrap}
.ebv3 tbody tr:hover>*{background:var(--hover)}
.ebv3 td.num,.ebv3 th.num{text-align:right;font-variant-numeric:tabular-nums}
.ebv3 td.num{font-family:var(--mono)}
.ebv3 td small.w{white-space:normal}
.ebv3 table.os td{padding:8px 8px}
.ebv3 td small{display:block;font-family:var(--sans);font-size:11px;line-height:15px;color:var(--weaker);white-space:nowrap}
.ebv3 b.ct{font-size:15px;white-space:nowrap}.ebv3 b.ct span{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--weak)}
.ebv3 td.bad,.ebv3 td.bad b.ct{color:var(--bad)}.ebv3 td.ok{color:var(--ok);font-family:var(--sans);font-weight:600}
.ebv3 td.pend b.ct{color:var(--brand)}
.ebv3 td.dt{white-space:nowrap}
.ebv3 table.mx th.grp{text-align:center;color:var(--text);border-left:1px solid var(--border-input)}
.ebv3 table.mx .st{border-left:1px solid var(--border-input)}
.ebv3 table.mx td.empty{color:var(--border-input)}
.ebv3 table.os tbody th{font-weight:400;min-width:200px}
.ebv3 tr.det>td{background:#fafaf9}
.ebv3 .detg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 20px;font-size:13px}
.ebv3 .detg b{display:block;margin-bottom:4px}
.ebv3 .tw{overflow-x:auto}
/* badges */
.ebv3 .chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;line-height:18px;padding:2px 10px;border-radius:15rem;background:var(--neutral-bg);color:var(--text)}
.ebv3 .chip.new{background:var(--ok);color:#fff}
.ebv3 .loading{padding:32px;text-align:center;color:var(--weak)}
.ebv3 code{font-family:var(--mono);font-size:13px}
.ebv3 a{color:var(--link)}
/* modal (slds-modal) */
.ebv3 .dlg-scrim{position:fixed;inset:0;background:rgba(8,7,7,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.ebv3 .dlg{background:var(--card);border-radius:6px;max-width:640px;width:100%;max-height:90vh;overflow:auto;display:grid;gap:0;box-shadow:var(--sh-modal)}
.ebv3 .dlg h3{margin:0;padding:16px;font-size:20px;line-height:26px;text-align:center;border-bottom:1px solid var(--border)}
.ebv3 .dlg-b{display:grid;gap:8px;padding:16px}
.ebv3 .dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;background:var(--th);border-top:1px solid var(--border)}
.ebv3 .dlg-f .cap-sec{min-height:44px}.ebv3 .dlg-f .cap-post{width:auto;padding:0 20px;min-height:44px}
@media (max-width:600px){.ebv3 .seg.views button{flex:1;padding:0 6px}.ebv3 .btn-grp{width:100%}.ebv3 .btn-grp .cap-sec{flex:1}}
@media print{.ebv3{margin:0;background:#fff}.ebv3 .mode,.ebv3 #v3-banner,.ebv3 .cap-top,.ebv3 [data-det],.ebv3 .ph-sub{display:none!important}.ebv3 .cap-card,.ebv3 .ph{box-shadow:none}.ebv3 .tw{overflow:visible}.navbar,.web-footer,footer,.page-breadcrumbs{display:none!important}}
/* Order & stock (05/11/2026): one headline, a coverage bar per type, detail on tap */
.ebv3{--c-fg:#2e844a;--c-pipe:#3d52c4;--c-short:#b35a00;--c-none:#c9c9c9}
.ebv3 .os-hero{background:var(--card);border:1px solid var(--border-input);border-radius:6px;box-shadow:none;padding:18px 20px;display:grid;gap:14px}
.ebv3 .os-big{display:grid;gap:2px}
.ebv3 .os-big .n{font-size:14px;font-weight:600;color:var(--weak)}
.ebv3 .os-big .v{font-size:36px;line-height:44px;font-weight:600;letter-spacing:-.02em;color:var(--heading);font-variant-numeric:tabular-nums}
.ebv3 .os-big .v small{font-size:18px;font-weight:600}
.ebv3 .os-big .s{font-size:14px;color:var(--weak)}
.ebv3 .os-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--neutral-bg);gap:1px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ebv3 .os-hero .os-bar{height:16px;border-radius:8px}
.ebv3 .os-bar span{display:block;min-width:2px}
.ebv3 .os-bar .fg,.ebv3 .os-lg i.fg{background:var(--c-fg)}.ebv3 .os-bar .pipe,.ebv3 .os-lg i.pipe{background:var(--c-pipe)}
.ebv3 .os-bar .short,.ebv3 .os-lg i.short{background:var(--c-short)}.ebv3 .os-bar .none,.ebv3 .os-lg i.none{background:var(--c-none)}
.ebv3 .os-legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px 20px}
.ebv3 .os-lg{display:grid;grid-template-columns:12px minmax(0,1fr);column-gap:8px;align-items:center}
.ebv3 .os-lg i{width:12px;height:12px;border-radius:3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ebv3 .os-lg .n{font-size:13px;color:var(--weak)}
.ebv3 .os-lg .v,.ebv3 .os-lg .s{grid-column:2}
.ebv3 .os-lg .v{font-size:18px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
.ebv3 .os-lg .v small{font-size:12px;color:var(--weak)}
.ebv3 .os-lg .s{font-size:12px;color:var(--weak)}
.ebv3 .os-card{padding-bottom:0}
.ebv3 .os-card>.tw{margin-bottom:0}
.ebv3 .os-card .cap-h .cap-note{display:block}
.ebv3 table.osl thead th{font-size:13px;color:var(--weak)}
.ebv3 table.osl th,.ebv3 table.osl td{padding:12px 14px;vertical-align:middle;font-family:var(--sans)}
.ebv3 table.osl tbody th{font-weight:400;min-width:220px}
.ebv3 table.osl tbody th b{display:block;font-size:15px;line-height:20px}
.ebv3 table.osl .sub{display:block;font-size:13px;line-height:18px;color:var(--weak)}
.ebv3 table.osl .chip{margin-top:4px}
.ebv3 .chip.low{background:var(--warn-bg);color:var(--warn)}
.ebv3 table.osl .chip.okc{background:var(--ok-bg);color:var(--ok);margin:0}
.ebv3 table.osl b.ct{font-size:16px}
.ebv3 table.osl td small{font-size:12px;color:var(--weak)}
.ebv3 table.osl .sh b.ct,.ebv3 table.osl .sh b.ct span{color:var(--warn)}
.ebv3 table.osl .cv{width:30%;min-width:180px}
.ebv3 table.osl .pc{display:block;height:auto;padding-left:0;margin-top:5px;font-size:12px;color:var(--weak)}
.ebv3 table.osl .dash{color:var(--weaker)}
.ebv3 table.osl .tg{width:44px;padding:0 8px 0 0}
