<style>
/* Exercise Book Production v3 (preview). Floor mode, VCL Lightning style: Calibri, VCL Blue #2B3990,
   inputs >= 48px, quantities 26px mono, one full-width Post. Tokens mirror the click-through. */
.ebv3{--success:#3f6b4e;--surface:#f1ebdd;--raised:#ece6dc;--sunken:#e3dccb;--ink:#4a4542;--muted:#4d5b66;
  --border:#d8bf95;--border-strong:#857252;--brand:#2b3990;--brand-text:#2b3990;--on-brand:#fff;--brand-tint:#e3e3e4;
  --warn-text:#6e3b2a;--warn-tint:#ece0d7;--ok-text:#3f6b4e;--ok-tint:#e0eae2;--info-text:#1b6a7c;--info-tint:#dce9ec;
  --sans:Calibri,Carlito,"Segoe UI",Arial,system-ui,sans-serif;--mono:"Courier New",Courier,"Liberation Mono",monospace;
  background:var(--surface);color:var(--ink);font:16px/22px var(--sans);margin:0 calc(50% - 50vw);padding:0 0 40px;min-height:100vh}
.ebv3 *{box-sizing:border-box}
.ebv3 .wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.ebv3 header.bar{background:var(--brand);color:var(--on-brand)}
.ebv3 header.bar .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:14px 16px}
.ebv3 header.bar h1{margin:0;font-size:22px;line-height:28px;font-weight:700;color:var(--on-brand)}
.ebv3 header.bar p{margin:0;font-size:13px;opacity:.85}
.ebv3 .mode{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0}
.ebv3 .mode .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:4px;overflow:hidden}
.ebv3 .mode .seg button{font:inherit;font-weight:700;min-height:44px;padding:0 16px;border:0;background:var(--raised);color:var(--ink);cursor:pointer}
.ebv3 .mode .seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.ebv3 .mode .seg button:disabled{opacity:.55;cursor:not-allowed}
.ebv3 .mode .why{font-size:14px;color:var(--muted)}
.ebv3 .banner{padding:10px 14px;border-radius:4px;font-weight:700;margin:0 0 12px}
.ebv3 .banner.preview{background:var(--info-tint);color:var(--info-text)}
.ebv3 .banner.live{background:var(--warn-tint);color:var(--warn-text)}
.ebv3 .fchart{width:100%;height:auto;display:block;font-family:var(--sans);margin:4px 0 14px}
.ebv3 .fn rect{fill:var(--raised);stroke:var(--brand);stroke-width:2}
.ebv3 .fn.grey rect{fill:var(--sunken);stroke:var(--border);stroke-width:2}
.ebv3 .fn.grey text{fill:var(--muted)}
.ebv3 .fn.end rect{fill:var(--ok-tint);stroke:var(--success)}
.ebv3 .fh{font-weight:700;font-size:16px;fill:var(--ink)}.ebv3 .fs{font-size:13px;fill:var(--muted)}
.ebv3 .fst{font-size:12px;font-weight:700;fill:var(--brand-text)}.ebv3 .fn.grey .fst{fill:var(--muted)}
.ebv3 .fa{fill:none;stroke:var(--border-strong);stroke-width:2}.ebv3 .fah{fill:var(--border-strong)}
.ebv3 .fh-narrow{display:none}
@media (max-width:700px){.ebv3 .fh-wide{display:none}.ebv3 .fh-narrow{display:block;max-width:360px;margin:0 auto 14px}}
.ebv3 .cap{display:grid;gap:14px;background:var(--sunken);border:1px solid var(--border);border-radius:8px;padding:14px}
.ebv3 .cap-top{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.ebv3 .cap-grp{display:grid;gap:4px;min-width:0;flex:1 1 240px}
.ebv3 .lb{font-size:13px;font-weight:700;color:var(--muted)}
.ebv3 select,.ebv3 input{font:18px var(--sans);min-height:48px;padding:0 12px;border:1px solid var(--border-strong);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.ebv3 input.qty{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-height:58px}
.ebv3 .cap-steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ebv3 .cap-steps button{flex:1 1 120px;display:grid;gap:2px;text-align:left;font:inherit;padding:10px 12px;border:1px solid var(--border);border-top:4px solid var(--brand);border-radius:4px;background:var(--raised);color:var(--ink);cursor:pointer;min-width:0}
.ebv3 .cap-steps button .k{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.ebv3 .cap-steps button .t{font-weight:700;font-size:16px}
.ebv3 .cap-steps button.fg{border-top-color:var(--success)}
.ebv3 .cap-steps button[aria-selected="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.ebv3 .cap-steps button[aria-selected="true"] .k{color:var(--on-brand);opacity:.85}
.ebv3 .cap-steps .arr{color:var(--muted);flex:none}
.ebv3 .cap-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.ebv3 .cap-grid{grid-template-columns:1fr}.ebv3 .cap-steps .arr{display:none}}
.ebv3 .cap-card{background:#fffdf8;border:1px solid var(--border);border-radius:6px;padding:14px;display:grid;gap:12px;min-width:0;align-content:start}
.ebv3 .cap-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.ebv3 .cap-h h3{margin:0;font-size:18px}
.ebv3 .cap-note{font-size:13px;color:var(--muted)}
.ebv3 .cap-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.ebv3 .cap-f{display:grid;gap:4px;min-width:0}
.ebv3 .cap-ro{min-height:48px;display:flex;align-items:center;font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ebv3 .cap-ro.mono{font-family:var(--mono)}
.ebv3 .cap-check{display:flex;gap:10px;align-items:center;font-size:15px}
.ebv3 .cap-check input{width:24px;min-height:24px;height:24px}
.ebv3 .cap-post{font:inherit;font-weight:700;font-size:18px;min-height:56px;border:0;border-radius:4px;background:var(--brand);color:var(--on-brand);cursor:pointer;width:100%}
.ebv3 .cap-post:disabled{background:var(--border-strong);cursor:not-allowed;opacity:.7}
.ebv3 .cap-sec{font:inherit;font-weight:700;min-height:44px;padding:0 14px;border-radius:4px;border:1px solid var(--border-strong);background:#fff;color:var(--brand-text);cursor:pointer}
.ebv3 .cap-rows{display:grid;gap:6px}
.ebv3 .cap-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:4px;border:1px solid var(--border);background:var(--raised)}
.ebv3 .cap-row .d{font-family:var(--mono);font-weight:700;font-size:13px;text-align:center;padding:2px 0;border-radius:2px}
.ebv3 .cap-row.out .d{background:var(--warn-tint);color:var(--warn-text)}
.ebv3 .cap-row.in .d{background:var(--ok-tint);color:var(--ok-text)}
.ebv3 .cap-row .it{min-width:0}.ebv3 .cap-row .it code{display:block;overflow-wrap:anywhere;font-family:var(--mono);font-size:13px}
.ebv3 .cap-row .it span{font-size:12px;color:var(--muted)}
.ebv3 .cap-row .q{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ebv3 .cap-row .q b{font-size:16px}.ebv3 .cap-row .q small{display:block;color:var(--muted);font-size:12px}
.ebv3 .cap-msg{padding:10px 12px;border-radius:4px;font-size:14px}
.ebv3 .cap-msg.bad{background:var(--warn-tint);color:var(--warn-text);font-weight:700}
.ebv3 .cap-msg.warn{background:#f6e7c8;color:#6b4a07;font-weight:700}
.ebv3 .cap-msg.ok{background:var(--ok-tint);color:var(--ok-text);font-weight:700}
.ebv3 .cap-msg.info{background:var(--info-tint);color:var(--info-text)}
.ebv3 .cap-stock{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ebv3 .cap-stock div{border:1px solid var(--border);border-radius:4px;padding:10px;background:var(--raised);display:grid;gap:2px}
.ebv3 .cap-stock .n{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ebv3 .cap-stock .v{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.ebv3 .cap-stock .s{font-size:12px;color:var(--muted)}
.ebv3 table{width:100%;border-collapse:collapse;font-size:14px}
.ebv3 th,.ebv3 td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.ebv3 th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.ebv3 td.num,.ebv3 th.num{text-align:right;font-family:var(--mono)}
.ebv3 .tw{overflow-x:auto}
.ebv3 .chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--brand-tint);color:var(--brand-text)}
.ebv3 .chip.new{background:var(--ok-tint);color:var(--ok-text)}
.ebv3 .loading{padding:30px;text-align:center;color:var(--muted)}
.ebv3 code{font-family:var(--mono);font-size:13px}
.ebv3 .dlg-scrim{position:fixed;inset:0;background:rgba(20,15,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.ebv3 .dlg{background:#fffdf8;border-radius:8px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:grid;gap:12px;border-top:6px solid var(--brand)}
.ebv3 .dlg h3{margin:0;font-size:20px}
.ebv3 .dlg-b{display:grid;gap:8px}
.ebv3 .dlg-f{display:grid;grid-template-columns:auto 1fr;gap:10px}
.ebv3 .dlg-f .cap-sec{min-height:56px}
</style>
<div class="ebv3" id="ebv3">
  <header class="bar"><div class="wrap">
    <h1>Exercise Book Production v3 (preview)</h1>
    <p>Covers → Folds → Inserts → Packing → Finished Goods · Vimit Converters Limited</p>
  </div></header>
  <div class="wrap">
    <div class="mode" id="v3-mode"></div>
    <div id="v3-banner"></div>
    <div id="v3-chart"></div>
    <div id="v3-app"><div class="loading">Loading stock from ERPNext…</div></div>
  </div>
</div>
