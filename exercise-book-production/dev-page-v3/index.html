<style>
/* Exercise Book Production v3 · Material 3 (05/11/2026). Same tokens and shapes as the VCL Android
   app (ui/theme/Color.kt, Shapes.kt): VCL Blue #2B3990 primary, cool tinted surfaces, Carlito/Calibri,
   outlined fields with the label on the outline, pill buttons, 16px cards, 12px fields. */
.ebv3{--primary:#2b3990;--on-primary:#fff;--primary-c:#dde3ff;--on-primary-c:#0f1b5c;--bright:#3d6de3;
  --bg:#f4f6fa;--surf:#fff;--surf-c-low:#f0f3fa;--surf-c:#e9edf7;--surf-c-high:#e2e7f3;--outline:#8a94a6;--outline-v:#cbd2dc;--rule:#e6eaf0;
  --heading:#0f172a;--ink:#1e293b;--ink2:#475569;--muted:#64708a;
  --ok:#15803d;--ok-c:#e6f6ec;--bad:#c2410c;--bad-c:#fdede7;--warn:#b45309;--warn-c:#fff4e0;--info:#2b3990;--info-c:#eaf0ff;
  --sans:Carlito,Calibri,"Segoe UI",Roboto,Arial,system-ui,sans-serif;--mono:"Liberation Mono","Courier New",Courier,monospace;
  --e1:0 1px 2px rgba(15,23,42,.08),0 1px 3px 1px rgba(15,23,42,.05);--e3:0 4px 8px 3px rgba(15,23,42,.10),0 1px 3px rgba(15,23,42,.14);
  --lb-bg:var(--bg);
  background:var(--bg);color:var(--ink);font:16px/22px var(--sans);margin:0 calc(50% - 50vw);padding:0 0 48px;min-height:100vh}
.ebv3 *{box-sizing:border-box}
.ebv3 .wrap{max-width:1200px;margin:0 auto;padding:0 16px}
/* top app bar: tinted surface, primary title */
.ebv3 header.bar{background:var(--surf-c);border-bottom:1px solid var(--rule)}
.ebv3 header.bar .wrap{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px;padding:16px}
.ebv3 header.bar h1{margin:0;font-size:24px;line-height:30px;font-weight:700;color:var(--primary)}
.ebv3 header.bar p{margin:0;font-size:14px;color:var(--ink2)}
/* segmented buttons (M3): outlined pill group, selected = secondary container + check */
.ebv3 .mode{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0 12px}
.ebv3 .seg{display:inline-flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden;flex:none}
.ebv3 .seg button{font:inherit;font-size:15px;font-weight:700;min-height:44px;padding:0 18px;border:0;border-left:1px solid var(--outline);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ebv3 .seg button:first-child{border-left:0}
.ebv3 .seg button:hover{background:rgba(43,57,144,.06)}
.ebv3 .seg button[aria-pressed="true"]{background:var(--primary-c);color:var(--on-primary-c)}
.ebv3 .seg button[aria-pressed="true"]::before{content:"\2713";font-weight:700}
.ebv3 .seg.views button{min-height:48px;padding:0 22px;font-size:16px}
/* banners */
.ebv3 .banner{padding:12px 16px;border-radius:12px;font-weight:700;margin:0 0 12px}
.ebv3 .banner.preview{background:var(--info-c);color:var(--info)}
.ebv3 .banner.live{background:var(--warn-c);color:var(--warn)}
/* flowchart */
.ebv3 .fchart{width:100%;height:auto;display:block;font-family:var(--sans);margin:4px 0 16px}
.ebv3 .fn rect{fill:var(--surf);stroke:var(--primary);stroke-width:1.5;rx:14px;ry:14px}
.ebv3 .fn.grey rect{fill:var(--surf-c);stroke:var(--outline-v)}
.ebv3 .fn.grey text{fill:var(--muted)}
.ebv3 .fn.end rect{fill:var(--ok-c);stroke:var(--ok);rx:28px;ry:28px}
.ebv3 .fh{font-weight:700;font-size:16px;fill:var(--heading)}.ebv3 .fs{font-size:13px;fill:var(--ink2)}
.ebv3 .fst{font-size:12px;font-weight:700;fill:var(--primary)}.ebv3 .fn.grey .fst{fill:var(--muted)}
.ebv3 .fa{fill:none;stroke:var(--outline);stroke-width:2}.ebv3 .fah{fill:var(--outline)}
.ebv3 .fh-narrow{display:none}
@media (max-width:700px){.ebv3 .fh-wide{display:none}.ebv3 .fh-narrow{display:block;max-width:360px;margin:0 auto 14px}}
/* containers */
.ebv3 .cap{--lb-bg:var(--surf-c-low);display:grid;gap:16px;background:var(--surf-c-low);border-radius:20px;padding:16px}
.ebv3 .cap-top{display:flex;flex-wrap:wrap;gap:16px 12px;align-items:center;padding-top:6px}
.ebv3 .cap-grp{position:relative;display:block;min-width:0;flex:1 1 240px}
.ebv3 .cap-grp.of{flex:1 1 140px}
.ebv3 .cap-card{--lb-bg:var(--surf);background:var(--surf);border-radius:16px;padding:16px;display:grid;gap:14px;min-width:0;align-content:start;box-shadow:var(--e1)}
.ebv3 .cap-h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.ebv3 .cap-h h3{margin:0;font-size:20px;line-height:26px;color:var(--heading)}
.ebv3 .cap-note{font-size:13px;color:var(--ink2)}
/* outlined text fields: label sits on the outline */
.ebv3 .lb{position:absolute;top:-9px;left:10px;padding:0 6px;font-size:12px;line-height:16px;font-weight:700;color:var(--ink2);background:var(--lb-bg);border-radius:4px;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;pointer-events:none}
.ebv3 select,.ebv3 input{font:17px var(--sans);min-height:52px;padding:0 14px;border:1px solid var(--outline);border-radius:12px;background-color:transparent;color:var(--heading);width:100%;outline:0}
.ebv3 select{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22%3E%3Cpath d=%22M7 10l5 5 5-5z%22 fill=%22%23475569%22/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 8px center}
.ebv3 select:hover,.ebv3 input:hover{border-color:var(--heading)}
.ebv3 select:focus,.ebv3 input:focus{border:2px solid var(--primary);padding-left:13px}
.ebv3 .cap-grp:focus-within .lb,.ebv3 .cap-f:focus-within .lb{color:var(--primary)}
.ebv3 select:disabled{opacity:.6}
.ebv3 input.qty{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-height:60px}
/* station tabs: tonal cards */
.ebv3 .cap-steps{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ebv3 .cap-steps button{flex:1 1 120px;display:grid;gap:2px;text-align:left;font:inherit;padding:12px 14px;border:0;border-radius:16px;background:var(--surf);color:var(--ink);cursor:pointer;min-width:0;box-shadow:var(--e1)}
.ebv3 .cap-steps button:hover{background:var(--surf-c)}
.ebv3 .cap-steps button .k{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.ebv3 .cap-steps button .t{font-weight:700;font-size:17px}
.ebv3 .cap-steps button.fg .k{color:var(--ok)}
.ebv3 .cap-steps button[aria-selected="true"]{background:var(--primary);color:var(--on-primary)}
.ebv3 .cap-steps button[aria-selected="true"] .k{color:var(--on-primary);opacity:.85}
.ebv3 .cap-steps .arr{color:var(--outline);flex:none}
.ebv3 .cap-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.ebv3 .cap-grid{grid-template-columns:1fr}.ebv3 .cap-steps .arr{display:none}}
.ebv3 .cap-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px 12px;padding-top:8px}
.ebv3 .cap-f{position:relative;display:grid;gap:4px;min-width:0}
.ebv3 .cap-f .lb:has(+ .cap-ro){background:var(--surf-c-low)}
.ebv3 .cap-ro{min-height:52px;display:flex;align-items:center;padding:0 14px;border-radius:12px;background:var(--surf-c-low);font-weight:700;font-size:16px;color:var(--heading);overflow-wrap:anywhere}
.ebv3 .cap-ro.mono{font-family:var(--mono);font-size:14px}
.ebv3 .cap-check{display:flex;gap:12px;align-items:center;font-size:15px;padding:10px 14px;border-radius:12px;background:var(--surf-c-low);cursor:pointer}
.ebv3 .cap-check input{width:22px;min-height:22px;height:22px;accent-color:var(--primary);flex:none}
/* buttons: filled pill (primary), tonal pill (secondary) */
.ebv3 .cap-post{font:inherit;font-weight:700;font-size:18px;min-height:56px;border:0;border-radius:999px;background:var(--primary);color:var(--on-primary);cursor:pointer;width:100%;box-shadow:var(--e1)}
.ebv3 .cap-post:hover{box-shadow:var(--e3)}
.ebv3 .cap-post:disabled{background:rgba(30,41,59,.12);color:rgba(30,41,59,.38);box-shadow:none;cursor:not-allowed}
.ebv3 .cap-sec{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:0 20px;border-radius:999px;border:0;background:var(--primary-c);color:var(--on-primary-c);cursor:pointer;white-space:nowrap}
.ebv3 .cap-sec:hover{background:#cfd7ff}
.ebv3 .cap-sec.sm{min-height:36px;padding:0 14px;font-size:14px}
.ebv3 .cap-sec:disabled{opacity:.5;cursor:not-allowed}
/* entry rows */
.ebv3 .cap-rows{display:grid;gap:8px}
.ebv3 .cap-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surf-c-low)}
.ebv3 .cap-row .d{font-family:var(--mono);font-weight:700;font-size:13px;text-align:center;padding:4px 0;border-radius:999px}
.ebv3 .cap-row.out .d{background:var(--bad-c);color:var(--bad)}
.ebv3 .cap-row.in .d{background:var(--ok-c);color:var(--ok)}
.ebv3 .cap-row .it{min-width:0}.ebv3 .cap-row .it code{display:block;overflow-wrap:anywhere;font-family:var(--mono);font-size:13px;color:var(--heading)}
.ebv3 .cap-row .it span{font-size:12px;color:var(--ink2)}
.ebv3 .cap-row .q{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ebv3 .cap-row .q b{font-size:16px;color:var(--heading)}.ebv3 .cap-row .q small{display:block;color:var(--ink2);font-size:12px}
/* messages */
.ebv3 .cap-msg{padding:12px 14px;border-radius:12px;font-size:14px}
.ebv3 .cap-msg.bad{background:var(--bad-c);color:var(--bad);font-weight:700}
.ebv3 .cap-msg.warn{background:var(--warn-c);color:var(--warn);font-weight:700}
.ebv3 .cap-msg.ok{background:var(--ok-c);color:var(--ok);font-weight:700}
.ebv3 .cap-msg.info{background:var(--info-c);color:var(--info)}
/* stat tiles */
.ebv3 .cap-stock{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ebv3 .cap-stock div{border-radius:14px;padding:12px 14px;background:var(--surf);display:grid;gap:2px;box-shadow:var(--e1)}
.ebv3 .cap-card .cap-stock div{background:var(--surf-c-low);box-shadow:none}
.ebv3 .cap-stock .n{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.ebv3 .cap-stock .v{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--heading)}
.ebv3 .cap-stock .s{font-size:12px;color:var(--ink2)}
/* tables */
.ebv3 table{width:100%;border-collapse:collapse;font-size:14px}
.ebv3 th,.ebv3 td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.ebv3 thead th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);background:var(--surf-c-low);border-bottom:0}
.ebv3 tbody tr:hover>*{background:rgba(43,57,144,.03)}
.ebv3 td.num,.ebv3 th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ebv3 td small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink2);white-space:nowrap}
.ebv3 td.bad{color:var(--bad)}.ebv3 td.ok{color:var(--ok);font-family:var(--sans);font-weight:700}
.ebv3 table.mx th.grp{text-align:center;background:var(--surf-c);color:var(--heading)}
.ebv3 table.mx .st{border-left:2px solid var(--rule)}
.ebv3 table.mx td.pend{font-weight:700;color:var(--primary)}
.ebv3 table.mx td.empty{color:var(--outline)}
.ebv3 table.os tbody th{font-weight:400;min-width:200px}
.ebv3 tr.det>td{background:var(--surf-c-low)}
.ebv3 .detg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 20px;font-size:13px}
.ebv3 .detg b{display:block;margin-bottom:4px;color:var(--heading)}
.ebv3 .tw{overflow-x:auto}
.ebv3 td.dt{white-space:nowrap}
.ebv3 .chip{display:inline-flex;align-items:center;font-size:13px;font-weight:700;min-height:28px;padding:0 12px;border-radius:8px;border:1px solid var(--outline-v);color:var(--ink2);background:var(--surf)}
.ebv3 .chip.new{background:var(--ok-c);color:var(--ok);border-color:transparent}
.ebv3 .loading{padding:32px;text-align:center;color:var(--ink2)}
.ebv3 code{font-family:var(--mono);font-size:13px}
.ebv3 a{color:var(--bright)}
/* dialog (M3 basic dialog) */
.ebv3 .dlg-scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:1000}
.ebv3 .dlg{--lb-bg:var(--surf-c-low);background:var(--surf-c-low);border-radius:28px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:grid;gap:14px;box-shadow:var(--e3)}
.ebv3 .dlg h3{margin:0;font-size:22px;line-height:28px;color:var(--heading)}
.ebv3 .dlg .cap-row{background:var(--surf)}
.ebv3 .dlg-b{display:grid;gap:8px}
.ebv3 .dlg-f{display:grid;grid-template-columns:auto 1fr;gap:10px}
.ebv3 .dlg-f .cap-sec{min-height:56px;background:transparent;color:var(--primary)}
.ebv3 .dlg-f .cap-sec:hover{background:rgba(43,57,144,.08)}
@media (max-width:600px){.ebv3 .seg.views{width:100%}.ebv3 .seg.views button{flex:1;padding:0 8px}.ebv3 .cap{padding:12px;border-radius:16px}}
@media print{.ebv3{margin:0;background:#fff}.ebv3 .mode,.ebv3 #v3-banner,.ebv3 #v3-chart,.ebv3 .cap-top,.ebv3 [data-det],.ebv3 header.bar p{display:none!important}.ebv3 .cap,.ebv3 .cap-card{box-shadow:none;background:#fff;padding:0}.ebv3 .tw{overflow:visible}.navbar,.web-footer,footer,.page-breadcrumbs{display:none!important}}
</style>
<div class="ebv3" id="ebv3">
  <header class="bar"><div class="wrap">
    <h1>Exercise Book Production v3 (preview)</h1>
    <p>Covers → Folds → Inserts → Packing → Finished Goods · Vimit Converters Limited</p>
  </div></header>
  <div class="wrap">
    <div class="mode" id="v3-mode"></div>
    <div id="v3-banner"></div>
    <div id="v3-chart"></div>
    <div id="v3-app"><div class="loading">Loading stock from ERPNext…</div></div>
  </div>
</div>
